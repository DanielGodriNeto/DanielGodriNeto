    <text xml:space="preserve" class="m" x="14.0" y="252.0" textLength="296.0" lengthAdjust="spacing">    /# #############################\</text>
    <text xml:space="preserve" class="m" x="14.0" y="264.5" textLength="296.0" lengthAdjust="spacing">   /################################\</text>
    <text xml:space="preserve" class="m" x="14.0" y="277.0" textLength="304.0" lengthAdjust="spacing">  /##################################\</text>
    <text x="174.0" y="39.5" text-anchor="middle" class="m">|</text>
    <text class="flag" x="177.0" y="37.5" style="fill:#e0a458;font-weight:700">&gt;</text>
    <text class="bob" x="62.0" y="252.0" style="fill:#e0a458;font-weight:700">@</text>
