<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Profile card: a climber at 1100 metres on K2, one contribution per metre">
  <style>
    text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace; font-size: 13px; fill: #e8eef2; }
    .k { fill: #7fb6d4; font-weight: 700; }
    .dim { fill: #7d8a96; font-size: 11px; }
    .m { fill: #5b6b78; font-size: 12px; white-space: pre; }
    .flake { fill: #e8eef2; opacity: .6; animation: fall linear infinite; }
    .bob { animation: bob 2.4s ease-in-out infinite; }
    .flag { transform-box: fill-box; transform-origin: left center; animation: wave 3s ease-in-out infinite; }
    @keyframes fall { to { transform: translate(-26px, 240px); } }
    @keyframes bob { 50% { transform: translateY(-1.5px); } }
    @keyframes wave { 50% { transform: scaleX(.82); } }
    @media (prefers-reduced-motion: reduce) { .flake, .bob, .flag { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="819" height="299" rx="8" fill="#0f1419" stroke="#2b3640"/>
  <line x1="352" y1="24" x2="352" y2="276" stroke="#2b3640"/>

  <g>
    <text xml:space="preserve" class="m" x="14.0" y="52.0" textLength="168.0" lengthAdjust="spacing">                   /\</text>
    <text xml:space="preserve" class="m" x="14.0" y="64.5" textLength="176.0" lengthAdjust="spacing">                  /  \</text>
    <text xml:space="preserve" class="m" x="14.0" y="77.0" textLength="184.0" lengthAdjust="spacing">                 /    \</text>
