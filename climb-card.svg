  <text x="372" y="62" style="font-size:15px;font-weight:700">daniel<tspan style="fill:#7fb6d4">@</tspan>github</text>
  <line x1="372" y1="72" x2="468" y2="72" stroke="#2b3640"/>
    <text x="372" y="98"><tspan class="k">Name</tspan><tspan class="v" x="466">Daniel Godri Neto</tspan></text>
  <text x="372" y="117"><tspan class="k">Study</tspan><tspan class="v" x="466">Computer Science, PUC-PR</tspan></text>
  <text x="372" y="136"><tspan class="k">Focus</tspan><tspan class="v" x="466">Applied AI, game and graphics tooling</tspan></text>
  <text x="372" y="155"><tspan class="k">Stack</tspan><tspan class="v" x="466">Python, Java, JavaScript</tspan></text>
  <text x="372" y="174"><tspan class="k">Languages</tspan><tspan class="v" x="466">Portuguese, English (C1), Japanese (learning)</tspan></text>
  <text x="372" y="193"><tspan class="k">Repos</tspan><tspan class="v" x="466">39 public</tspan></text>
  <text x="372" y="212"><tspan class="k">Joined</tspan><tspan class="v" x="466">2026-03</tspan></text>

  <text x="372" y="243"><tspan class="k">Altitude</tspan><tspan class="v" x="466">1,100 m of 8,611 m</tspan></text>
  <rect x="372" y="255" width="300" height="6" rx="3" fill="#2b3640"/>
  <rect x="372" y="255" width="38.3" height="6" rx="3" fill="#e0a458"/>
  <text class="dim" x="372" y="279">1 contribution = 1 metre. Summit: K2.</text>
