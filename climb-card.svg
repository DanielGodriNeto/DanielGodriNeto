    <text xml:space="preserve" class="m" x="14.0" y="139.5" textLength="216.0" lengthAdjust="spacing">            /.............\</text>
    <text xml:space="preserve" class="m" x="14.0" y="152.0" textLength="224.0" lengthAdjust="spacing">           /:::::::::::::::\</text>
    <text xml:space="preserve" class="m" x="14.0" y="164.5" textLength="232.0" lengthAdjust="spacing">          /:::::::::::::::::\</text>
    <text xml:space="preserve" class="m" x="14.0" y="177.0" textLength="232.0" lengthAdjust="spacing">         /::::::::::::::::::\</text>
    <text xml:space="preserve" class="m" x="14.0" y="189.5" textLength="256.0" lengthAdjust="spacing">         /:::::::::::::::::::::\</text>
    <text xml:space="preserve" class="m" x="14.0" y="202.0" textLength="264.0" lengthAdjust="spacing">        /:::::::::::::::::::::::\</text>
