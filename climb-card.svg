    <text class="flake" x="114" y="30" style="animation-duration:12s;animation-delay:-3s">.</text>
    <text class="flake" x="197" y="30" style="animation-duration:11s;animation-delay:-6s">.</text>
    <text class="flake" x="280" y="30" style="animation-duration:10s;animation-delay:-9s">*</text>
    <text class="flake" x="63" y="30" style="animation-duration:9s;animation-delay:-3s">.</text>
    <text class="flake" x="146" y="30" style="animation-duration:8s;animation-delay:-7s">.</text>
    <text class="flake" x="229" y="30" style="animation-duration:7s;animation-delay:-4s">*</text>
    <text class="flake" x="312" y="30" style="animation-duration:12s;animation-delay:-9s">.</text>
