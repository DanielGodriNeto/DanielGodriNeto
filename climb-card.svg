<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Profile card: a climber at 1100 metres on K2's east face, one contribution per metre">
  <style>
    text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace; font-size: 13px; fill: #e8eef2; }
    .k { fill: #7fb6d4; font-weight: 700; }
    .dim { fill: #7d8a96; font-size: 11px; }
    .tag { font-size: 9px; fill: #e0a458; }
    .drift { fill: #e8eef2; opacity: .55; animation: fall linear infinite; }
    .bob { animation: bob 2.4s ease-in-out infinite; }
    .flag { transform-box: fill-box; transform-origin: left center; animation: wave 3s ease-in-out infinite; }
    @keyframes fall { to { transform: translate(-30px, 250px); } }
    @keyframes bob { 50% { transform: translateY(-1.5px); } }
    @keyframes wave { 50% { transform: scaleX(.8); } }
    @media (prefers-reduced-motion: reduce) { .drift, .bob, .flag { animation: none; } }
  </style>
